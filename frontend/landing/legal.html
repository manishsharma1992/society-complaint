<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{legal_title}} · Runwal MyCity Residents</title>
  <meta name="description" content="{{legal_meta}}">
  <link rel="canonical" href="https://runwalltdfakepromises.com{{legal_path}}">
  <link rel="alternate" hreflang="en" href="https://runwalltdfakepromises.com/legal/">
  <link rel="alternate" hreflang="hi" href="https://runwalltdfakepromises.com/hi/legal/">
  <link rel="alternate" hreflang="mr" href="https://runwalltdfakepromises.com/mr/legal/">
  <link rel="alternate" hreflang="x-default" href="https://runwalltdfakepromises.com/legal/">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfcfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b120d" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
  <script>{{theme_boot}}</script>
  <style>
{{shared_css}}
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 24px); scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .top, .theme { transition: none; } }
    body { margin: 0; background: var(--surface); color: var(--on-surface); font: 400 1.0625rem/1.7 var(--font-body); -webkit-font-smoothing: antialiased; }
    a { color: var(--link); text-underline-offset: 0.18em; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; font-weight: 600; text-decoration: none;
      background: var(--color-accent); color: var(--color-accent-ink); transition: background-color 160ms ease-out, transform 120ms ease-out; }
    .btn:hover { background: var(--color-accent-press); }
    .btn:active { transform: scale(0.97); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    main { max-width: 46rem; margin-inline: auto; padding: calc(var(--header-h) + 48px) var(--shell-gutter) 96px; }
    h1 { font-size: clamp(2.25rem, 3vw + 1rem, 3.25rem); line-height: 1.1; letter-spacing: -0.02em; margin: 0; }
    :lang(hi) h1, :lang(mr) h1, :lang(hi) h2, :lang(mr) h2 { letter-spacing: 0; line-height: 1.35; }
    .updated { color: var(--on-surface-2); margin: 12px 0 0; }
    .note { margin: 24px 0 0; padding: 16px 20px; border-radius: 14px; background: var(--surface-2); color: var(--on-surface-2); }
    .toc { list-style: none; margin: 40px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .toc a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface-2); color: var(--on-surface);
      text-decoration: none; font-size: 0.9375rem; font-weight: 600; }
    .toc a:hover { background: var(--on-surface); color: var(--surface); }
    section { margin-top: 72px; }
    h2 { font-size: 1.75rem; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 16px; }
    main p, main ul, main ol { margin: 0 0 16px; }
    main ul, main ol { padding-inline-start: 1.4em; }
    main li + li { margin-top: 6px; }
    .toc li + li { margin-top: 0; }
    main li ul { margin: 8px 0 0; }
  </style>
</head>
<body>
  {{header}}
  <main id="main">
    <h1>{{legal_title}}</h1>
    <p class="updated">{{updated}}</p>
    {{note}}
    <nav aria-label="{{legal_title}}"><ul class="toc">{{toc}}</ul></nav>
    {{sections}}
  </main>
  {{footer}}
  <script>{{shared_js}}</script>
</body>
</html>
