# Shared by the HTTP and HTTPS server blocks: installed as /etc/nginx/snippets/society-complaint-app.conf.

# The app (all contexts in one JVM): /api/complaint/..., /api/residency/... are passed through unchanged
location /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # the first query after Neon has scaled to zero can take a few seconds
    proxy_read_timeout 30s;
    # the security headers below are set once, here, not also by Spring
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
}

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# The Angular app (deploy/deploy.sh frontend). Page paths such as /complaints/7 are the app's own: they get index.html.
root /var/www/society-complaint;
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
# index.html and the translations change with every release: always fetched fresh
location = /index.html {
    expires -1;
}
location ^~ /i18n/ {
    expires -1;
    try_files $uri =404;
}
# built files carry a content hash in their name, so a given name never changes
location ~ "^/(main|chunk|polyfills|styles)-[A-Za-z0-9_-]{8}\.(js|css)$" {
    expires max;
    try_files $uri =404;
}
location ^~ /media/ {
    expires max;
    try_files $uri =404;
}
location ^~ /images/ {
    expires 7d;
    try_files $uri =404;
}
# any other file that is missing is a 404, never the app's page (a stale tab must not get HTML for its script)
location ~* \.(js|css|map|json|ico|png|jpe?g|webp|svg|woff2?)$ {
    expires 1d;
    try_files $uri =404;
}
