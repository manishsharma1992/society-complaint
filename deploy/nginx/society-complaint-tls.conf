# Used once deploy/deploy.sh tls has obtained the Let's Encrypt certificate (renewed automatically by certbot.timer).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include snippets/acme-challenge.conf;
    location / {
        return 301 https://runwalltdfakepromises.com$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name runwalltdfakepromises.com www.runwalltdfakepromises.com;

    ssl_certificate /etc/letsencrypt/live/runwalltdfakepromises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runwalltdfakepromises.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1h;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include snippets/society-complaint-app.conf;
}
