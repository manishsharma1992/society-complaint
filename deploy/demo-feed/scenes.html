<!doctype html>
<!-- Illustrations for the example feed posts (deploy/demo-feed.sh). Each is stamped as an example, never evidence.
     Rendered to 1200x900 JPEGs (no metadata) by rendering each <svg id="..."> on its own. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; }
  svg { display: block; width: 1200px; height: 900px; }
</style>
</head>
<body>
<!-- 1. boundary wall with a gap, the road beyond -->
<svg id="wall-1" viewBox="0 0 1200 900">
  <rect width="1200" height="520" fill="#bcd6e6" />
  <rect y="520" width="1200" height="380" fill="#8f9a6b" />
  <rect y="600" width="1200" height="120" fill="#6d6d6d" />
  <g fill="#d9cfbf" stroke="#a89c88" stroke-width="4">
    <rect x="40" y="380" width="430" height="200" />
    <rect x="760" y="380" width="400" height="200" />
  </g>
  <g stroke="#a89c88" stroke-width="3">
    <line x1="40" y1="430" x2="470" y2="430" /><line x1="40" y1="480" x2="470" y2="480" /><line x1="40" y1="530" x2="470" y2="530" />
    <line x1="760" y1="430" x2="1160" y2="430" /><line x1="760" y1="480" x2="1160" y2="480" /><line x1="760" y1="530" x2="1160" y2="530" />
  </g>
  <path d="M470 580 L520 560 L560 585 L610 565 L700 590 L760 580" fill="none" stroke="#7a6d58" stroke-width="10" />
  <rect x="160" y="140" width="160" height="240" fill="#e9e4dc" /><rect x="880" y="120" width="180" height="260" fill="#e9e4dc" />
</svg>

<!-- 1b. close-up: where the wall stops -->
<svg id="wall-2" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#c7d8e2" />
  <rect y="560" width="1200" height="340" fill="#7f8b5c" />
  <rect x="0" y="250" width="560" height="360" fill="#d9cfbf" stroke="#a89c88" stroke-width="6" />
  <g stroke="#a89c88" stroke-width="4"><line x1="0" y1="340" x2="560" y2="340" /><line x1="0" y1="430" x2="560" y2="430" /><line x1="0" y1="520" x2="560" y2="520" /></g>
  <path d="M560 250 L600 300 L575 360 L615 420 L585 480 L620 540 L590 610 L560 610 Z" fill="#cbbfac" />
  <g fill="#9d8f78"><circle cx="680" cy="640" r="18" /><circle cx="760" cy="670" r="12" /><circle cx="720" cy="700" r="22" /></g>
</svg>

<!-- 2. pool behind a construction fence -->
<svg id="pool-1" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#cfe0ea" />
  <rect y="560" width="1200" height="340" fill="#b9b2a4" />
  <path d="M240 600 L960 600 L1040 760 L160 760 Z" fill="#9fc8d8" stroke="#7aa7b9" stroke-width="6" />
  <g fill="#e2b33a" stroke="#9c7a1f" stroke-width="4">
    <rect x="60" y="430" width="250" height="240" /><rect x="330" y="430" width="250" height="240" />
    <rect x="600" y="430" width="250" height="240" /><rect x="870" y="430" width="250" height="240" />
  </g>
  <g stroke="#9c7a1f" stroke-width="3">
    <path d="M60 430 L310 670 M310 430 L60 670 M330 430 L580 670 M580 430 L330 670 M600 430 L850 670 M850 430 L600 670 M870 430 L1120 670 M1120 430 L870 670" />
  </g>
  <rect x="380" y="150" width="440" height="220" fill="#ece6dc" /><rect x="420" y="190" width="120" height="80" fill="#a7c3d1" /><rect x="660" y="190" width="120" height="80" fill="#a7c3d1" />
</svg>

<!-- 3. unpaved stretch of internal road with standing water -->
<svg id="road-1" viewBox="0 0 1200 900">
  <rect width="1200" height="500" fill="#c9dbe6" />
  <rect x="760" y="60" width="300" height="440" fill="#e6e0d6" />
  <g fill="#a9c2d0"><rect x="800" y="100" width="60" height="50" /><rect x="900" y="100" width="60" height="50" /><rect x="800" y="190" width="60" height="50" /><rect x="900" y="190" width="60" height="50" /><rect x="800" y="280" width="60" height="50" /><rect x="900" y="280" width="60" height="50" /></g>
  <rect y="500" width="1200" height="400" fill="#8a9a62" />
  <path d="M420 500 L780 500 L1100 900 L100 900 Z" fill="#8d7a5e" />
  <path d="M420 500 L560 500 L480 900 L100 900 Z" fill="#6f6f6f" />
  <g fill="#9ab7c6" stroke="#7d9cab" stroke-width="4"><ellipse cx="620" cy="700" rx="140" ry="40" /><ellipse cx="760" cy="820" rx="170" ry="45" /><ellipse cx="600" cy="580" rx="70" ry="18" /></g>
</svg>

<!-- 4. lawn where a rainwater pit would be -->
<svg id="rain-1" viewBox="0 0 1200 900">
  <rect width="1200" height="480" fill="#c4d6e2" />
  <rect x="120" y="80" width="260" height="400" fill="#e6e0d6" /><rect x="820" y="40" width="280" height="440" fill="#e6e0d6" />
  <rect y="480" width="1200" height="420" fill="#86a05d" />
  <rect x="380" y="560" width="440" height="230" fill="none" stroke="#f4f1ea" stroke-width="8" stroke-dasharray="26 18" />
  <text x="600" y="705" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="700" fill="#f4f1ea">?</text>
</svg>

<!-- 5. play area: one slide, two empty plots -->
<svg id="play-1" viewBox="0 0 1200 900">
  <rect width="1200" height="460" fill="#c9dce8" />
  <rect y="460" width="1200" height="440" fill="#8daa62" />
  <rect x="70" y="560" width="320" height="250" fill="#d8c79f" stroke="#b39f72" stroke-width="5" />
  <path d="M150 760 L150 600 L230 600 L230 760 M230 620 L360 760" fill="none" stroke="#c0392b" stroke-width="16" />
  <rect x="140" y="580" width="100" height="24" fill="#2e86c1" />
  <rect x="440" y="560" width="320" height="250" fill="none" stroke="#f4f1ea" stroke-width="6" stroke-dasharray="22 16" />
  <rect x="810" y="560" width="320" height="250" fill="none" stroke="#f4f1ea" stroke-width="6" stroke-dasharray="22 16" />
</svg>

<script>
  // every scene gets the same stamp on top (font set per element: SVG text ignores the CSS font shorthand here)
  const NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs, text) => {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
    if (text) node.textContent = text;
    return node;
  };
  const font = { 'font-family': 'Helvetica, Arial, sans-serif', fill: '#fff' };
  document.querySelectorAll('svg').forEach((svg) => {
    const band = el('g', { transform: 'rotate(-18 600 450)' });
    band.append(el('rect', { x: -200, y: 395, width: 1600, height: 110, fill: 'rgba(176, 32, 32, 0.88)' }),
      el('text', { ...font, x: 600, y: 470, 'text-anchor': 'middle', 'font-size': 54, 'font-weight': 700, 'letter-spacing': 4 },
        'EXAMPLE PHOTO · NOT A REAL REPORT'));
    svg.append(band,
      el('rect', { x: 24, y: 24, width: 470, height: 56, rx: 8, fill: 'rgba(0, 0, 0, 0.62)' }),
      el('text', { ...font, x: 44, y: 62, 'font-size': 30, 'font-weight': 600 }, 'Illustration for a demo post'));
  });
</script>
</body>
</html>
